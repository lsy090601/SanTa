<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원가입</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      @font-face {
        font-family: "BMkkubulim";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/BMkkubulimTTF-Regular.woff2")
          format("woff2");
        font-weight: normal;
        font-style: normal;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #f5f7f6 0%, #e8f1ed 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: "Pretendard", sans-serif;
      }

      .card {
        width: 100%;
        max-width: 480px;
        background: #ffffff;
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 60px 40px;
        box-shadow: 0 20px 60px rgba(45, 122, 74, 0.08);
        transition: all 0.3s ease;
      }

      .card:hover {
        box-shadow: 0 30px 80px rgba(45, 122, 74, 0.12);
      }

      .logo {
        width: 160px;
        height: auto;
        margin-bottom: 16px;
      }

      .subtitle {
        font-size: 14px;
        color: #8b9b9d;
        margin-bottom: 40px;
        font-weight: 400;
      }

      form {
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      .field {
        position: relative;
        margin-bottom: 16px;
      }

      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #4a5568;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .field input {
        width: 100%;
        height: 48px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 16px;
        font-family: "Pretendard", sans-serif;
        font-weight: 400;
        font-size: 16px;
        color: #2c3e50;
        outline: none;
        background: #f9fafb;
        transition: all 0.3s ease;
      }

      .field input:focus {
        border-color: #2d7a4a;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(45, 122, 74, 0.1);
      }

      .field input::placeholder {
        color: #cbd5e0;
      }

      button {
        height: 48px;
        margin-top: 28px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #2d7a4a 0%, #1e5631 100%);
        color: #fff;
        font-family: "Pretendard", sans-serif;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        letter-spacing: 0.5px;
        box-shadow: 0 8px 24px rgba(45, 122, 74, 0.2);
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(45, 122, 74, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      .login-link {
        margin-top: 24px;
        text-align: center;
        font-size: 14px;
        color: #718096;
      }

      .login-link a {
        color: #2d7a4a;
        text-decoration: none;
        font-weight: 600;
      }

      .login-link a:hover {
        color: #1e5631;
        text-decoration: underline;
      }

      #message {
        margin-top: 16px;
        text-align: center;
        font-size: 14px;
        min-height: 20px;
        padding: 12px;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      #message:empty {
        padding: 0;
      }

      #message.success {
        color: #22863a;
        background: #f0f8f0;
      }

      #message.error {
        color: #cb2431;
        background: #fef4f4;
      }

      @media (max-width: 480px) {
        .card {
          padding: 40px 24px;
          border-radius: 20px;
        }

        .logo {
          width: 130px;
        }

        button {
          height: 44px;
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 style="color:#2f5d3a">SanTa</h1>
      <p class="subtitle">계정을 만들고 후기를 남겨보세요</p>
      <form id="signupForm">
        <div class="field">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            placeholder="example@email.com"
            required
          />
        </div>
        <div class="field">
          <label for="nickname">닉네임</label>
          <input
            type="text"
            id="nickname"
            placeholder="사용할 닉네임을 입력하세요"
            required
          />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input
            type="password"
            id="password"
            placeholder="비밀번호를 입력하세요"
            required
          />
        </div>
        <div class="field">
          <label for="passwordConfirm">비밀번호 확인</label>
          <input
            type="password"
            id="passwordConfirm"
            placeholder="비밀번호를 다시 입력하세요"
            required
          />
        </div>
        <button type="submit">회원가입</button>
        <p class="login-link">
          이미 계정이 있으신가요? <a href="logIn.html">로그인</a>
        </p>
      </form>
      <p id="message"></p>
    </div>

    <script src="config.js"></script>
    <script src="js/auth.js"></script>
    <script>
      const client = window.santaClient;

      document
        .getElementById("signupForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const nickname = document.getElementById("nickname").value;
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const passwordConfirm =
            document.getElementById("passwordConfirm").value;
          const messageEl = document.getElementById("message");

          if (password !== passwordConfirm) {
            messageEl.className = "error";
            messageEl.textContent = "비밀번호가 일치하지 않습니다.";
            return;
          }

          try {
            if (!client) {
              throw new Error("config.js에 Supabase URL과 공개 키를 설정해 주세요.");
            }
            // Supabase Auth가 비밀번호와 인증 세션을 관리합니다.
            // 닉네임은 사용자 추가 정보에 넣고 비밀번호 처리는 Auth에 맡깁니다.
            const result = await client.auth.signUp({
              email: email,
              password: password,
              options: {
                data: { nickname: nickname }
              }
            });
            const error = result.error;

            if (error) {
              messageEl.className = "error";
              messageEl.textContent =
                error.code === "23505"
                  ? "이미 가입된 이메일입니다."
                  : "회원가입 실패: " + error.message;
              return;
            }

            messageEl.className = "success";
            messageEl.textContent = "가입 요청 완료! 이메일 인증이 설정된 경우 메일을 확인한 뒤 로그인해 주세요.";
            setTimeout(() => (window.location.href = "logIn.html"), 1500);
          } catch (err) {
            messageEl.className = "error";
            messageEl.textContent = "회원가입 실패: " + err.message;
          }
        });
    </script>
  </body>
</html>
