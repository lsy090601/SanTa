<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santa</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <section class="search-section">
        <input type="text" placeholder="산 이름, 지역, 난이도로 선택" />
      </section>
    </header>

    <section class="recommend-mountain-card">
      <div class="mountain-card">
        <img src="assets/한라산.jpg" alt="한라산" />
        <div class="mountain-recommend-right">
          <p>오늘의 추천</p>
          <hr />
          <h2>
            대한민국에서 가장 높은 곳,
            <br />
            오늘 도전해볼까요?
          </h2>
          <p>1950m 정상에서 보는 풍경은 다른 산과는 확실히 달라요.</p>
        </div>
      </div>
    </section>

    <section class="mountain-type">
      <h2>나에게 맞는 산을 찾아볼까요?</h2>
      <p>검색 기능을 통해 조건에 맞는 산을 찾을 수 있어요.</p>
      <div class="main-mountain-img">
        <img src="assets/한라산.jpg" alt="한라산" />
        <img src="assets/지리산.jpg" alt="지리산" />
        <img src="assets/북한산.jpg" alt="북한산" />
      </div>
    </section>
  </body>
</html>
