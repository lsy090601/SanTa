<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 등산 기록 | SanTa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --green: #2f5d3a;
        --text: #1b1f1c;
        --muted: #6b736d;
        --placeholder: #9aa19b;
        --border: #e4e7e3;
        --subtle: #f5f5f5;
        --easy-bg: #e6f2e8;
        --easy-text: #2f6b3e;
        --medium-bg: #fbf1dc;
        --medium-text: #8a5a00;
        --hard-bg: #fbd5e2;
        --hard-text: #bc3b66;
        --danger: #a12a2a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Noto Sans KR", sans-serif;
        color: var(--text);
        background: #fff;
        line-height: 1.5;
        word-break: keep-all;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        background: none;
        border: 0;
      }

      /* 본문 */
      .content {
        display: flex;
        flex-direction: column;
        gap: 28px;
        padding: 48px 88px;
        min-height: 60vh;
      }

      .title h1 {
        font-size: 32px;
        font-weight: 700;
      }

      .title p {
        margin-top: 8px;
        font-size: 15px;
        color: var(--muted);
      }

      .summary {
        display: flex;
        gap: 20px;
      }

      .stat {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 24px;
        background: var(--subtle);
        border-radius: 20px;
      }

      .stat .label {
        font-size: 14px;
        color: var(--muted);
      }

      .stat .value {
        font-size: 30px;
        font-weight: 700;
        line-height: 1.3;
      }

      .list-title {
        font-size: 20px;
        font-weight: 700;
      }

      .records {
        display: flex;
        flex-direction: column;
        gap: 14px;
        list-style: none;
      }

      .record {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
      }

      .thumb {
        flex: none;
        width: 120px;
        height: 80px;
        object-fit: cover;
        border-radius: 12px;
        background: var(--easy-bg);
      }

      .info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .info .mountain {
        font-size: 13px;
        color: var(--muted);
      }

      .info .name {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.3;
      }

      .info .name:hover {
        text-decoration: underline;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tag {
        padding: 4px 10px;
        font-size: 12px;
        color: var(--muted);
        background: var(--subtle);
        border-radius: 999px;
      }

      .tag.easy {
        font-weight: 500;
        color: var(--easy-text);
        background: var(--easy-bg);
      }

      .tag.medium {
        font-weight: 500;
        color: var(--medium-text);
        background: var(--medium-bg);
      }

      .tag.hard {
        font-weight: 500;
        color: var(--hard-text);
        background: var(--hard-bg);
      }

      .date {
        flex: none;
        font-size: 14px;
        color: var(--muted);
      }

      .delete-btn {
        flex: none;
        padding: 4px;
        font-size: 13px;
        font-weight: 500;
        color: var(--danger);
      }

      .delete-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .state {
        padding: 48px 0;
        text-align: center;
        color: var(--muted);
      }

      .state a {
        color: var(--green);
        font-weight: 500;
        text-decoration: underline;
      }

      /* 푸터 */
      .footer {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 32px 88px;
        font-size: 13px;
        color: var(--muted);
        background: var(--subtle);
      }

      .footer p:last-child {
        font-size: 12px;
      }

      @media (max-width: 900px) {
        .content {
          padding: 32px 20px;
        }

        .footer {
          padding: 24px 20px;
        }

        .summary {
          flex-direction: column;
          gap: 12px;
        }

        .record {
          flex-wrap: wrap;
          gap: 12px 16px;
        }

        .thumb {
          width: 96px;
          height: 72px;
        }

        .date {
          margin-left: auto;
        }
      }
    </style>
  </head>
  <body>
    <!-- 상단 내비게이션 (js/header.js가 그려 줍니다) -->
    <script src="js/header.js"></script>

    <main class="content">
      <div class="title">
        <h1>내 등산 기록</h1>
        <p>‘다녀왔어요’로 남긴 코스를 한곳에서 볼 수 있어요</p>
      </div>

      <section class="summary" aria-label="요약">
        <div class="stat">
          <p class="label">다녀온 코스</p>
          <p class="value" id="statCount">-</p>
        </div>
        <div class="stat">
          <p class="label">누적 거리</p>
          <p class="value" id="statDistance">-</p>
        </div>
        <div class="stat">
          <p class="label">누적 소요시간</p>
          <p class="value" id="statTime">-</p>
        </div>
      </section>

      <h2 class="list-title">다녀온 코스</h2>
      <ul class="records" id="records"></ul>
      <p class="state" id="state">불러오는 중...</p>
    </main>

    <footer class="footer">
      <p>등산로 데이터 최종 수정일 2016-12-31 · 통제/폐쇄 정보는 실시간이 아니에요</p>
      <p>산 정보: 산림청 데이터</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/auth.js"></script>
    <script>
      // 내 등산 기록 화면입니다.
      // 실행 순서: 로그인 확인 → visits 테이블에서 내 기록 조회 → 코스 정보와 합치기 → 화면 그리기

      const client = window.santaClient;
      const recordsEl = document.getElementById('records');
      const stateEl = document.getElementById('state');

      // 코스 데이터의 난이도 이름을 화면 표시와 색상으로 바꿉니다.
      const DIFFICULTY = {
        '초심자': { label: '쉬움', className: 'easy' },
        '중급자': { label: '중간', className: 'medium' },
        '고수': { label: '어려움', className: 'hard' },
      };

      // 코스 사진이 없을 때 쓰는 기본 사진입니다.
      const FALLBACK_IMAGES = [
        'fronted/images/course-1.jpg',
        'fronted/images/course-2.jpg',
        'fronted/images/course-3.jpg',
        'fronted/images/course-4.jpg',
      ];

      let visits = []; // 내 기록 (visits 테이블 행)
      let courseById = {}; // course_id → 코스 정보

      function goToLogin() {
        sessionStorage.setItem('returnUrl', window.location.href);
        window.location.href = './logIn.html';
      }

      function showState(html) {
        stateEl.innerHTML = html;
        stateEl.style.display = '';
      }

      // 분 → "5시간 10분"
      function formatMinutes(total) {
        const hours = Math.floor(total / 60);
        const minutes = Math.round(total % 60);
        if (hours === 0) return minutes + '분';
        if (minutes === 0) return hours + '시간';
        return hours + '시간 ' + minutes + '분';
      }

      // "2026-09-20" → "2026.09.20"
      function formatDate(value) {
        return String(value).replaceAll('-', '.');
      }

      function courseMinutes(course) {
        return (Number(course.up_min) || 0) + (Number(course.down_min) || 0);
      }

      function makeTag(text, className) {
        const tag = document.createElement('span');
        tag.className = className ? 'tag ' + className : 'tag';
        tag.textContent = text;
        return tag;
      }

      function renderSummary() {
        let distance = 0;
        let minutes = 0;
        for (const visit of visits) {
          const course = courseById[visit.course_id];
          if (course) {
            distance += Number(course.distance_km) || 0;
            minutes += courseMinutes(course);
          }
        }
        document.getElementById('statCount').textContent = visits.length + '개';
        document.getElementById('statDistance').textContent = Math.round(distance * 10) / 10 + 'km';
        document.getElementById('statTime').textContent = formatMinutes(minutes);
      }

      function renderRecords() {
        recordsEl.replaceChildren();

        if (visits.length === 0) {
          showState('아직 남긴 기록이 없어요.<br /><a href="fronted/search.html">코스 검색하러 가기</a>');
          return;
        }
        stateEl.style.display = 'none';

        visits.forEach(function (visit, index) {
          const course = courseById[visit.course_id] || {};

          const item = document.createElement('li');
          item.className = 'record';

          const thumb = document.createElement('img');
          thumb.className = 'thumb';
          thumb.alt = '';
          thumb.src = course.mountain_image_url || FALLBACK_IMAGES[index % FALLBACK_IMAGES.length];

          const info = document.createElement('div');
          info.className = 'info';

          const mountain = document.createElement('p');
          mountain.className = 'mountain';
          mountain.textContent = course.mountain_name || '';

          const name = document.createElement('a');
          name.className = 'name';
          name.href = 'detail.html?id=' + encodeURIComponent(visit.course_id);
          name.textContent = course.course_name || course.mountain_name || '코스 정보 없음';

          const tags = document.createElement('div');
          tags.className = 'tags';
          const difficulty = DIFFICULTY[course.difficulty];
          if (difficulty) tags.append(makeTag(difficulty.label, difficulty.className));
          if (course.distance_km != null) tags.append(makeTag(course.distance_km + 'km'));

          info.append(mountain, name, tags);

          const date = document.createElement('p');
          date.className = 'date';
          date.textContent = formatDate(visit.visited_on) + ' 다녀옴';

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'delete-btn';
          remove.textContent = '기록 삭제';
          remove.addEventListener('click', function () {
            deleteVisit(visit, remove);
          });

          item.append(thumb, info, date, remove);
          recordsEl.append(item);
        });
      }

      async function deleteVisit(visit, button) {
        if (!confirm('이 기록을 삭제할까요?')) return;

        button.disabled = true;
        const result = await client.from('visits').delete().eq('id', visit.id);
        if (result.error) {
          console.error(result.error);
          alert('기록을 삭제하지 못했어요. 잠시 후 다시 시도해 주세요.');
          button.disabled = false;
          return;
        }

        visits = visits.filter(function (row) {
          return row.id !== visit.id;
        });
        renderSummary();
        renderRecords();
      }

      async function init() {
        await window.santaAuthReady;

        if (!client) {
          showState('로그인 설정을 확인해 주세요. (config.js)');
          return;
        }
        if (!window.santaUser) {
          goToLogin();
          return;
        }

        try {
          const [visitResult, courseResponse, mountainResponse] = await Promise.all([
            client
              .from('visits')
              .select('id, course_id, visited_on')
              .order('visited_on', { ascending: false })
              .order('id', { ascending: false }),
            fetch('./data/courses.json'),
            fetch('./data/mountains.json'),
          ]);

          if (visitResult.error) throw visitResult.error;
          if (!courseResponse.ok) throw new Error('courses.json HTTP ' + courseResponse.status);

          // 산 정보 페이지(MT_로 시작하는 ID)에서 남긴 기록도 보이도록 산 목록을 먼저 넣고,
          // 같은 ID가 있으면 코스 정보로 덮어씁니다.
          if (mountainResponse.ok) {
            for (const mountain of await mountainResponse.json()) {
              courseById[mountain.course_id] = mountain;
            }
          }
          for (const course of await courseResponse.json()) {
            courseById[course.course_id] = course;
          }
          visits = visitResult.data;

          renderSummary();
          renderRecords();
        } catch (error) {
          console.error(error);
          showState('기록을 불러오지 못했어요. 잠시 후 새로고침해 주세요.');
        }
      }

      init();
    </script>
  </body>
</html>
