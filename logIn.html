<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      @font-face {
        font-family: "BMkkubulim";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/BMkkubulimTTF-Regular.woff2")
          format("woff2");
        font-weight: normal;
        font-style: normal;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #f5f7f6 0%, #e8f1ed 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: "Pretendard", sans-serif;
      }

      .card {
        width: 100%;
        max-width: 480px;
        background: #ffffff;
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 60px 40px;
        box-shadow: 0 20px 60px rgba(45, 122, 74, 0.08);
        transition: all 0.3s ease;
      }

      .card:hover {
        box-shadow: 0 30px 80px rgba(45, 122, 74, 0.12);
      }

      .logo {
        width: 160px;
        height: auto;
        margin-bottom: 16px;
      }

      .subtitle {
        font-size: 14px;
        color: #8b9b9d;
        margin-bottom: 40px;
        font-weight: 400;
      }

      form {
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      .field {
        position: relative;
        margin-bottom: 16px;
      }

      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #4a5568;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .field input {
        width: 100%;
        height: 48px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px 16px 12px 16px;
        font-family: "Pretendard", sans-serif;
        font-weight: 400;
        font-size: 16px;
        color: #2c3e50;
        outline: none;
        background: #f9fafb;
        transition: all 0.3s ease;
      }

      .field input:focus {
        border-color: #2d7a4a;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(45, 122, 74, 0.1);
      }

      .field input::placeholder {
        color: #cbd5e0;
      }

      button {
        height: 48px;
        margin-top: 28px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #2d7a4a 0%, #1e5631 100%);
        color: #fff;
        font-family: "Pretendard", sans-serif;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 8px 24px rgba(45, 122, 74, 0.2);
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(45, 122, 74, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      .create {
        margin-top: 24px;
        text-align: center;
        font-size: 14px;
        color: #718096;
      }

      .create a {
        color: #2d7a4a;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s ease;
      }

      .create a:hover {
        color: #1e5631;
        text-decoration: underline;
      }

      #message {
        margin-top: 16px;
        text-align: center;
        font-size: 14px;
        min-height: 20px;
        padding: 12px;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      #message.success {
        color: #22863a;
        background: #f0f8f0;
      }

      #message.error {
        color: #cb2431;
        background: #fef4f4;
      }

      @media (max-width: 480px) {
        .card {
          padding: 40px 24px;
          border-radius: 20px;
        }

        .logo {
          width: 130px;
        }

        button {
          height: 44px;
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="assets/logo.svg" alt="SanTa" />
      <p class="subtitle">나에게 맞는 등산로를 찾아보세요</p>
      <form id="loginForm">
        <div class="field">
          <label for="email">이메일</label>
          <input type="email" id="email" placeholder="example@email.com" required />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input
            type="password"
            id="password"
            placeholder="비밀번호를 입력하세요"
            required
          />
        </div>
        <button type="submit">로그인</button>
        <p class="create">
          계정이 없으신가요? <a href="signIn.html">회원가입</a>
        </p>
      </form>
      <p id="message"></p>
    </div>

    <script>
      const SUPABASE_URL = "https://praypaewixxxudsmlxpj.supabase.co";
      const SUPABASE_KEY = "sb_publishable_AkbNzojx-Hs2Z0oM_pbrug_VpkRR-dv";
      const { createClient } = supabase;
      const client = createClient(SUPABASE_URL, SUPABASE_KEY);

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const messageEl = document.getElementById("message");

          try {
            // 비밀번호를 직접 조회/비교하지 않고, DB 함수(login_user)에서만 검증한다
            const { data, error } = await client
              .rpc("login_user", { p_email: email, p_password: password })
              .single();

            if (error || !data) {
              messageEl.className = "error";
              messageEl.textContent = "이메일 또는 비밀번호가 잘못되었습니다.";
              return;
            }

            messageEl.className = "success";
            messageEl.textContent = "로그인 성공!";
            localStorage.setItem("userId", data.id);
            localStorage.setItem("userEmail", data.email);

            // 로그인 후 원래 페이지로 돌아가기
            const returnUrl = sessionStorage.getItem('returnUrl');
            setTimeout(() => {
              if (returnUrl) {
                sessionStorage.removeItem('returnUrl');
                window.location.href = returnUrl;
              } else {
                window.location.href = "detail.html";
              }
            }, 1000);
          } catch (err) {
            messageEl.className = "error";
            messageEl.textContent = "로그인 실패: " + err.message;
          }
        });
    </script>
  </body>
</html>
