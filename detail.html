<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일에서도 화면 폭에 맞게 보이도록 하는 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>코스 상세 - SanTa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --green: #2f5d3a;
        --ink: #1b1f1c;
        --muted: #6b736d;
        --line: #e4e7e3;
        --panel: #f5f5f5;
      }

      body {
        background: #fff;
        font-family: "Noto Sans KR", sans-serif;
        color: var(--ink);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font-family: inherit;
        cursor: pointer;
      }

      svg {
        display: block;
        flex-shrink: 0;
      }

      /* ---------- 상단 내비게이션 ---------- */
      .nav {
        display: flex;
        align-items: center;
        gap: 40px;
        padding: 16px 88px;
        border-bottom: 1px solid var(--line);
      }

      .logo {
        display: flex;
        align-items: center;
      }

      .logo img {
        height: 32px;
        width: auto;
      }

      .search {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 22px;
        border: 1px solid var(--line);
        border-radius: 999px;
      }

      .search input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        font-family: inherit;
        font-size: 15px;
        color: var(--ink);
      }

      .search input::placeholder {
        color: #9aa19b;
      }

      .menu {
        display: flex;
        align-items: center;
        gap: 28px;
        font-size: 15px;
        color: var(--muted);
        white-space: nowrap;
      }

      .menu .on {
        font-weight: 700;
        color: var(--ink);
      }

      .menu .record {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .pill-btn {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 999px;
        padding: 8px 20px;
        font-size: 15px;
        font-weight: 500;
        color: var(--ink);
      }

      .pill-btn:hover {
        background: var(--panel);
      }

      /* ---------- 코스 상세 영역 (산 사진 + 패널) ---------- */
      .hero {
        position: relative;
        height: 740px;
        padding: 30px;
        overflow: hidden;
        background: #dce9dc;
      }

      .hero-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .photo-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        width: 48px;
        height: 48px;
        border: none;
        border-radius: 12px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .panel {
        position: relative;
        width: 360px;
        max-height: 100%;
        overflow-y: auto;
        background: var(--panel);
        border-radius: 24px;
      }

      .panel-head {
        background: #fff;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .back-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .icon-btn {
        border: none;
        background: none;
        padding: 0;
        display: flex;
      }

      .fold-btn {
        width: 44px;
        height: 44px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .region {
        font-size: 13px;
        color: var(--muted);
      }

      h1 {
        font-size: 26px;
        font-weight: 700;
        line-height: normal;
      }

      .panel-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .panel-body h2 {
        font-size: 16px;
        font-weight: 700;
      }

      .card {
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .card.tall {
        gap: 18px;
      }

      .level {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }

      .badge {
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
      }

      /* 난이도 값이 그대로 class 이름이 되어서 색이 정해짐 */
      .badge.초심자 {
        background: #e3f0e4;
        color: var(--green);
      }

      .badge.중급자 {
        background: #fbf1dc;
        color: #8a5a00;
      }

      .badge.고수 {
        background: #f9e4e4;
        color: #a12a2a;
      }

      .row {
        display: flex;
        justify-content: space-between;
      }

      .stat {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 130px;
      }

      .stat:first-child {
        width: auto;
      }

      .stat dt {
        font-size: 13px;
        color: var(--muted);
      }

      .stat dd {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        font-size: 24px;
        font-weight: 700;
        white-space: nowrap;
      }

      .stat dd small {
        font-size: 14px;
        font-weight: 400;
        color: var(--muted);
      }

      .risk {
        background: #f9e4e4;
        border-radius: 16px;
        padding: 16px;
        font-size: 14px;
        font-weight: 500;
        color: #a12a2a;
      }

      .record-btn {
        width: 100%;
        padding: 13px 20px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        font-size: 15px;
        font-weight: 500;
        color: var(--ink);
      }

      .record-btn:hover {
        background: var(--panel);
      }

      .source {
        font-size: 12px;
        color: var(--muted);
      }

      /* ---------- 후기 ---------- */
      .reviews {
        padding: 56px 88px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .reviews h2 {
        font-size: 24px;
        font-weight: 700;
      }

      .login-box {
        background: var(--panel);
        border-radius: 20px;
        padding: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .login-box .title {
        font-size: 16px;
        font-weight: 500;
      }

      .login-box .sub {
        font-size: 14px;
        color: var(--muted);
      }

      .login-box .pill-btn {
        padding: 10px 20px;
      }

      #reviewForm {
        display: none;
        background: var(--panel);
        border-radius: 20px;
        padding: 20px;
      }

      #reviewContent {
        width: 100%;
        height: 100px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-family: inherit;
        font-size: 15px;
        resize: none;
        outline: none;
      }

      #submitReviewBtn {
        margin-top: 12px;
        width: 100%;
        padding: 13px 20px;
        border: none;
        border-radius: 999px;
        background: var(--green);
        color: #fff;
        font-size: 15px;
        font-weight: 500;
      }

      #submitReviewBtn:disabled {
        opacity: 0.6;
      }

      .review {
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .review-head {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 500;
      }

      .review-date {
        font-size: 13px;
        font-weight: 400;
        color: var(--muted);
      }

      .review-delete-btn {
        margin-left: auto;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 12px;
        color: #a12a2a;
      }

      .review-content {
        font-size: 15px;
        line-height: 24px;
      }

      .empty {
        color: var(--muted);
        font-size: 15px;
        padding: 18px 0;
      }

      /* ---------- 푸터 ---------- */
      .footer {
        background: var(--panel);
        padding: 32px 88px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .footer p:last-child {
        font-size: 12px;
      }

      .state {
        padding: 80px 88px;
      }

      .sample a {
        display: block;
        padding: 10px 0;
        color: var(--green);
      }

      /* ---------- 작은 화면 ---------- */
      @media (max-width: 900px) {
        .nav {
          flex-wrap: wrap;
          gap: 16px;
          padding: 16px 20px;
        }
        .search {
          order: 3;
          flex-basis: 100%;
        }
        .menu {
          gap: 16px;
          margin-left: auto;
        }
        .menu .hide-sm {
          display: none;
        }
        .hero {
          height: auto;
          min-height: 740px;
          padding: 16px;
        }
        .panel {
          width: 100%;
          max-height: none;
        }
        .photo-btn {
          display: none;
        }
        .reviews,
        .footer,
        .state {
          padding-left: 20px;
          padding-right: 20px;
        }
      }
    </style>
  </head>
  <body>
    <!-- 상단 내비게이션 -->
    <header class="nav">
      <a href="index.html" class="logo"><img src="assets/logo.svg" alt="SanTa" /></a>
      <form class="search" onsubmit="return false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6b736d" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-4-4" />
        </svg>
        <input type="text" placeholder="찾고 싶은 산이나 코스를 입력해 주세요." />
      </form>
      <nav class="menu">
        <a href="index.html" class="hide-sm">코스 추천</a>
        <a href="index.html" class="on hide-sm">코스 검색</a>
        <span class="record hide-sm">
          내 기록
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b736d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6" /></svg>
        </span>
        <button class="pill-btn" id="navLoginBtn" onclick="goToLogin()">로그인</button>
      </nav>
    </header>

    <!-- 화면 내용을 자바스크립트가 이 div 안에 그려 넣음 -->
    <main id="app"><p class="state">불러오는 중...</p></main>

    <footer class="footer">
      <p>등산로 데이터 최종 수정일 2016-12-31 · 통제/폐쇄 정보는 실시간이 아니에요</p>
      <p>※ 화면 속 코스 정보는 디자인용 예시예요</p>
    </footer>

    <!-- Supabase 라이브러리 로드 (후기 데이터베이스 연동용) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      // ============================================
      // 1. Supabase 초기화 (후기 데이터 저장/조회)
      // ============================================
      const SUPABASE_URL = "https://pray0paewixxxudsmlxpj.supabase.co";
      const SUPABASE_KEY = "sb_publishable_Ak0bNzojx-Hs2Z0oM_pbrug_VpkRR-dv";
      const { createClient } = supabase;
      const client = createClient(SUPABASE_URL, SUPABASE_KEY);

      // ============================================
      // 2. URL 파라미터에서 코스 ID 추출 (예: detail.html?id=PMNTN_00007)
      // ============================================
      const params = new URLSearchParams(location.search);
      const courseId = params.get("id");

      // 산 사진이 없거나 불러오지 못할 때 쓰는 기본 산 일러스트
      const FALLBACK_HERO =
        "data:image/svg+xml;utf8," +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" preserveAspectRatio="xMidYMid slice">' +
            '<rect width="1280" height="740" fill="#dce9dc"/>' +
            '<circle cx="950" cy="230" r="66" fill="#f7faf6"/>' +
            '<path d="M300 740V300L620 140L960 330L1280 520V740Z" fill="#a0c0a0"/>' +
            '<path d="M380 740L780 440L1280 600V740Z" fill="#5f8f62"/>' +
            '<path d="M0 740L500 400L900 640L1280 500V740Z" fill="#5f8f62"/>' +
            "</svg>",
        );

      // ============================================
      // 3. 코스 데이터 불러오기
      // ============================================
      fetch("./data/courses.json")
        .then((res) => res.json())
        .then((courses) => {
          // ?id= 파라미터가 없으면 개발용 코스 목록 표시
          if (!courseId) return renderSample(courses);

          const c = courses.find((x) => x.course_id === courseId);
          if (!c) return renderError("해당 코스를 찾을 수 없어요.");
          render(c);
        })
        .catch((error) => {
          console.error("데이터 로드 실패:", error);
          renderError("데이터를 불러오지 못했어요.");
        });

      // 분 → "1시간 30분" 형식 (숫자는 크게, 단위는 작게 보여주는 HTML)
      function fmtHtml(min) {
        const h = Math.floor(min / 60);
        const m = min % 60;
        const num = (n) => `<span>${n}</span>`;
        const unit = (u) => `<small>${u}</small>`;
        if (h === 0) return num(m) + unit("분");
        return num(h) + unit("시간 ") + (m ? num(m) + unit("분") : "");
      }

      // 후기 작성 시 HTML이 섞여 들어가지 않도록 이스케이프
      function esc(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch],
        );
      }

      // ============================================
      // 코스 상세 페이지 렌더링
      // ============================================
      function render(c) {
        document.title = c.course_name + " - SanTa";
        const total = c.up_min + c.down_min;
        const heroImg = c.mountain_image_url || FALLBACK_HERO;

        document.getElementById("app").innerHTML = `
          <section class="hero">
            <img class="hero-bg" src="${esc(heroImg)}" alt="${esc(c.mountain_name)}"
                 onerror="this.onerror=null;this.src=FALLBACK_HERO">

            <button class="photo-btn" aria-label="사진 보기">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1b1f1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <circle cx="9" cy="10" r="1.5" />
                <path d="M21 16l-5-5-9 9" />
              </svg>
            </button>

            <aside class="panel">
              <div class="panel-head">
                <div class="back-row">
                  <button class="icon-btn" aria-label="뒤로 가기" onclick="history.length > 1 ? history.back() : (location.href = 'index.html')">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1b1f1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg>
                  </button>
                  <button class="fold-btn" aria-label="접기" onclick="togglePanel()">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1b1f1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6" /></svg>
                  </button>
                </div>
                <p class="region">${esc(c.region ? c.region + " · " : "")}${esc(c.mountain_name)}</p>
                <h1>${esc(c.course_name)}${c.closed ? " 🚫" : ""}</h1>
              </div>

              <div class="panel-body" id="panelBody">
                <h2>기본 정보</h2>
                <div class="card">
                  <div class="level">난이도 <span class="badge ${esc(c.difficulty)}">${esc(c.difficulty)}</span></div>
                  <dl class="row">
                    <div class="stat"><dt>총 거리</dt><dd><span>${c.distance_km}</span><small>km</small></dd></div>
                    <div class="stat"><dt>소요시간</dt><dd>${fmtHtml(total)}</dd></div>
                  </dl>
                </div>

                <h2>산 정보</h2>
                <div class="card tall">
                  <dl class="row">
                    <div class="stat"><dt>산 높이</dt><dd>${
                      c.mountain_height_m ? `<span>${c.mountain_height_m}</span><small>m</small>` : "<span>-</span>"
                    }</dd></div>
                    <div class="stat"><dt>지형</dt><dd><span>${esc(c.terrain_type || "-")}</span></dd></div>
                  </dl>
                  <dl class="row">
                    <div class="stat"><dt>상행</dt><dd>${fmtHtml(c.up_min)}</dd></div>
                    <div class="stat"><dt>하행</dt><dd>${fmtHtml(c.down_min)}</dd></div>
                  </dl>
                </div>

                ${
                  c.risk_note
                    ? `<h2>위험구간</h2><p class="risk">${esc(c.risk_note)}</p>`
                    : ""
                }

                <button class="record-btn" onclick="recordVisit()">다녀왔어요 · 기록하기</button>
                <p class="source">산 사진과 높이는 산림청 산정보 OpenAPI 기준이에요</p>
              </div>
            </aside>
          </section>

          <section class="reviews">
            <h2 id="reviewsTitle">후기</h2>

            <!-- 로그인 전 안내 -->
            <div id="loginPrompt" class="login-box">
              <p class="title">후기를 남기려면 로그인이 필요해요</p>
              <p class="sub">Google 계정으로 간단하게 로그인할 수 있어요</p>
              <button class="pill-btn" onclick="goToLogin()">Google로 로그인</button>
            </div>

            <!-- 로그인 후 입력폼 -->
            <div id="reviewForm">
              <textarea id="reviewContent" placeholder="이 코스에 대한 후기를 남겨주세요..."></textarea>
              <button id="submitReviewBtn" onclick="submitReview()">저장</button>
            </div>

            <div id="reviewsList"></div>
            <p id="emptyReviewsMsg" class="empty" style="display:none">아직 후기가 없어요.</p>
          </section>
        `;

        // 로그인 상태에 따라 안내 / 입력폼 / 상단 버튼 전환
        const userEmail = localStorage.getItem("userEmail");
        if (userEmail) {
          document.getElementById("loginPrompt").style.display = "none";
          document.getElementById("reviewForm").style.display = "block";
          document.getElementById("navLoginBtn").style.display = "none";
        }

        loadReviews();
      }

      // 패널 본문 접기/펼치기
      function togglePanel() {
        const body = document.getElementById("panelBody");
        body.style.display = body.style.display === "none" ? "" : "none";
      }

      // "다녀왔어요 · 기록하기" — 로그인 필요
      function recordVisit() {
        if (!localStorage.getItem("userEmail")) {
          alert("로그인이 필요합니다.");
          goToLogin();
          return;
        }
        alert("기록 기능은 준비 중이에요.");
      }

      // 로그인 페이지로 이동 (로그인 후 돌아올 수 있게 현재 주소 저장)
      function goToLogin() {
        sessionStorage.setItem("returnUrl", window.location.href);
        window.location.href = "./logIn.html";
      }

      // 이메일 마스킹 (예: kha***@gmail.com)
      function maskEmail(email) {
        if (!email) return "익명";
        const [local, domain] = email.split("@");
        return `${local.slice(0, 3)}${"*".repeat(Math.max(0, local.length - 3))}@${domain}`;
      }

      // ============================================
      // 후기 작성 / 삭제 / 조회 (Supabase)
      // ============================================
      async function submitReview() {
        const userEmail = localStorage.getItem("userEmail");
        const reviewText = document.getElementById("reviewContent").value.trim();

        if (!userEmail) {
          alert("로그인이 필요합니다.");
          goToLogin();
          return;
        }
        if (!reviewText) {
          alert("후기를 입력해주세요.");
          return;
        }

        const btn = document.getElementById("submitReviewBtn");
        btn.disabled = true;
        btn.textContent = "저장 중...";

        try {
          const { error } = await client.from("reviews").insert([
            {
              course_id: courseId,
              user_email: userEmail,
              content: reviewText,
              created_at: new Date().toISOString(),
            },
          ]);
          if (error) {
            alert("후기 저장 실패: " + error.message);
            return;
          }
          alert("후기가 저장되었습니다!");
          document.getElementById("reviewContent").value = "";
          loadReviews();
        } catch (err) {
          alert("오류 발생: " + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "저장";
        }
      }

      // 자신의 후기만 삭제 가능
      async function deleteReview(reviewId, reviewEmail) {
        const userEmail = localStorage.getItem("userEmail");
        if (userEmail !== reviewEmail) {
          alert("자신의 후기만 삭제할 수 있습니다.");
          return;
        }
        if (!confirm("정말 삭제하시겠습니까?")) return;

        try {
          const { error } = await client.from("reviews").delete().eq("id", reviewId);
          if (error) {
            alert("삭제 실패: " + error.message);
            return;
          }
          alert("후기가 삭제되었습니다.");
          loadReviews();
        } catch (err) {
          alert("오류 발생: " + err.message);
        }
      }

      // 이 코스의 후기를 최신순으로 불러와 표시
      async function loadReviews() {
        const list = document.getElementById("reviewsList");
        const emptyMsg = document.getElementById("emptyReviewsMsg");
        const title = document.getElementById("reviewsTitle");

        try {
          const { data, error } = await client
            .from("reviews")
            .select("*")
            .eq("course_id", courseId)
            .order("created_at", { ascending: false });

          if (error) {
            console.error("후기 로드 실패:", error);
            return;
          }

          title.textContent = "후기 " + (data ? data.length : 0);

          if (!data || data.length === 0) {
            list.innerHTML = "";
            emptyMsg.style.display = "block";
            return;
          }
          emptyMsg.style.display = "none";

          const userEmail = localStorage.getItem("userEmail");
          list.innerHTML = data
            .map((r) => {
              const d = new Date(r.created_at);
              const date = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
              return `
                <div class="review">
                  <div class="review-head">
                    <span>${esc(maskEmail(r.user_email))}</span>
                    <span class="review-date">${date}</span>
                    ${
                      userEmail === r.user_email
                        ? `<button class="review-delete-btn" onclick="deleteReview(${Number(r.id)}, '${esc(r.user_email)}')">삭제</button>`
                        : ""
                    }
                  </div>
                  <p class="review-content">${esc(r.content)}</p>
                </div>`;
            })
            .join("");
        } catch (err) {
          console.error("오류:", err);
        }
      }

      // 코스를 찾을 수 없거나 데이터 로딩에 실패했을 때
      function renderError(msg) {
        document.getElementById("app").innerHTML = `<p class="state empty">${msg}</p>`;
      }

      // ?id= 없이 열었을 때 보여주는 개발용 코스 목록
      function renderSample(courses) {
        const picks = ["초심자", "중급자", "고수"].flatMap((d) =>
          courses.filter((c) => c.difficulty === d && c.mountain_image_url).slice(0, 3),
        );
        document.getElementById("app").innerHTML = `
          <div class="state">
            <h2>코스를 선택하세요 (개발용)</h2>
            <div class="sample">
              ${picks
                .map(
                  (c) =>
                    `<a href="detail.html?id=${c.course_id}">${c.mountain_name} / ${c.course_name} · ${c.difficulty} · ${c.distance_km}km</a>`,
                )
                .join("")}
            </div>
          </div>`;
      }
    </script>
  </body>
</html>
